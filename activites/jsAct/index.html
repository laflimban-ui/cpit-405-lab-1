<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>NBA Standings - Sort & Filter</title>
  <link rel="stylesheet" href="style.css">
  <script src="code.js"></script>
</head>
<body>
  <h1>NBA Standings</h1>
  <!-- Filter Controls -->
  <div class="filter-controls">
    <label for="team-filter">Minimum Wins:</label>
    <input type="text" id="team-filter" onkeyup="filterTable()" placeholder="e.g. 45">
    
  </div>

   
  
  <!-- Table -->
  <table>
    <thead>
      <tr>
        <th onclick="sort(this)">Team<span class="asc"></span></th>
        <th onclick="sort(this)">Wins<span class="asc"></span></th>
        <th onclick="sort(this)">Losses<span class="asc"></span></th>
        <th onclick="sort(this)">Win %<span class="asc"></span></th>

      </tr>
    </thead>
    <tbody>
      <tr>
        <td>Celtics</td>
        <td>48</td>
        <td>12</td>
        <td>0.80</td>
      </tr>
      <tr>
        <td>Heat</td>
        <td>40</td>
        <td>32</td>
        <td>0.56</td>
      </tr>
      <tr>
        <td>76ers</td>
        <td>52</td>
        <td>20</td>
        <td>0.72</td>
      </tr>
      <tr>
        <td>Raptors</td>
        <td>46</td>
        <td>26</td>
        <td>0.64</td>
      </tr>
      <tr>
        <td>Milwaukee Bucks</td>
        <td>56</td>
        <td>17</td>
        <td>0.77</td>
      </tr>
    </tbody>
  </table>
 
</body>
</html>
